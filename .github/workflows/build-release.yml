name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  # ========================================
  # macOS AltServer (Swift Package Manager)
  # ========================================
  build-altserver-macos:
    name: Build AltServer (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.9'

      - name: Build AltServer (macOS)
        run: |
          swift build -c release --product AltServerCLI
          
      - name: Create AltServer Archive
        run: |
          mkdir -p build/AltServer
          cp .build/release/AltServerCLI build/AltServer/AltServer
          chmod +x build/AltServer/AltServer
          
          # Create DMG
          hdiutil create -volname "AltServer" -srcfolder build/AltServer -ov -format UDZO build/AltServer.dmg
          
      - name: Upload AltServer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltServer-macOS
          path: build/AltServer.dmg

  # ========================================
  # Windows AltServer (.NET 8 WPF)
  # ========================================
  build-altserver-windows:
    name: Build AltServer (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Windows Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolsDir = "build\AltServer-Windows\tools"
          $dlDir = "build\_dl"
          New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null
          New-Item -ItemType Directory -Path $dlDir -Force | Out-Null

          Write-Host "=== 下载 libimobiledevice-win32 ==="
          $libiApi = "https://api.github.com/repos/libimobiledevice-win32/imobiledevice-net/releases/latest"
          $release = Invoke-RestMethod -Uri $libiApi -UseBasicParsing -TimeoutSec 30
          $asset = $release.assets | Where-Object { $_.name -like "*win64.zip" } | Select-Object -First 1
          if (-not $asset) { throw "libimobiledevice asset not found" }
          Write-Host "  URL: $($asset.browser_download_url)"
          curl.exe -L --silent --fail -o "$dlDir\libi.zip" $asset.browser_download_url
          Expand-Archive -Path "$dlDir\libi.zip" -DestinationPath "$dlDir\libi" -Force
          foreach ($exe in @("idevice_id.exe","ideviceinfo.exe","ideviceinstaller.exe","idevicepair.exe")) {
            $f = Get-ChildItem -Path "$dlDir\libi" -Recurse -Filter $exe -EA SilentlyContinue | Select-Object -First 1
            if ($f) { Copy-Item $f.FullName $toolsDir -Force; Write-Host "  OK $exe" } else { Write-Host "  MISSING $exe" }
          }
          Get-ChildItem "$dlDir\libi" -Recurse -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName $toolsDir -Force -EA SilentlyContinue }

          Write-Host "=== 下载 zsign ==="
          $zsignApi = "https://api.github.com/repos/zhlynn/zsign/releases/latest"
          $zsignRelease = Invoke-RestMethod -Uri $zsignApi -UseBasicParsing -TimeoutSec 30
          $zsignAsset = $zsignRelease.assets | Where-Object { $_.name -like "*windows*" -or $_.name -like "*win64*" } | Select-Object -First 1
          if (-not $zsignAsset) { $zsignAsset = $zsignRelease.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1 }
          if (-not $zsignAsset) { throw "zsign asset not found" }
          Write-Host "  URL: $($zsignAsset.browser_download_url)"
          curl.exe -L --silent --fail -o "$dlDir\zsign.zip" $zsignAsset.browser_download_url
          Expand-Archive -Path "$dlDir\zsign.zip" -DestinationPath "$dlDir\zsign" -Force
          $zf = Get-ChildItem "$dlDir\zsign" -Recurse -Filter "zsign.exe" -EA SilentlyContinue | Select-Object -First 1
          if ($zf) { Copy-Item $zf.FullName $toolsDir -Force; Write-Host "  OK zsign.exe" } else { Write-Host "  MISSING zsign.exe" }
          Get-ChildItem "$dlDir\zsign" -Recurse -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName $toolsDir -Force -EA SilentlyContinue }

          Remove-Item "$dlDir" -Recurse -Force -EA SilentlyContinue

          Write-Host "=== 验证 ==="
          foreach ($t in @("idevice_id.exe","ideviceinfo.exe","ideviceinstaller.exe","idevicepair.exe","zsign.exe")) {
            $p = Join-Path $toolsDir $t
            if (Test-Path $p) { $s = [math]::Round((Get-Item $p).Length/1KB,1); Write-Host "  $t ($s KB)" }
            else { Write-Host "  MISSING: $t" }
          }

      - name: Restore NuGet
        run: dotnet restore AltServer.Windows/AltServer.Windows.csproj

      - name: Build
        run: dotnet publish AltServer.Windows/AltServer.Windows.csproj -c Release --self-contained true -r win-x64 -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o build/AltServer-Windows

      - name: Create Windows Package
        shell: pwsh
        run: |
          Write-Host "=== 发布目录内容 ==="
          Get-ChildItem build/AltServer-Windows -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

          Compress-Archive -Path build/AltServer-Windows/* -DestinationPath build/AltServer-Windows.zip -Force
          Write-Host "ZIP created: $((Get-Item build/AltServer-Windows.zip).Length / 1MB) MB"
          
      - name: Upload AltServer Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltServer-Windows
          path: build/AltServer-Windows.zip

  # ========================================
  # iOS AltStore IPA
  # ========================================
  build-altstore-ios:
    name: Build AltStore (iOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AltStore IPA
        run: |
          mkdir -p build

          # CI 没有开发者证书,禁用签名;AltServer 安装时会用用户的 Apple ID 重新签名
          xcodebuild -project AltStore/AltStore.xcodeproj \
            -scheme AltStore \
            -configuration Release \
            -archivePath build/AltStore.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_PRODUCT=NO

          # 将 .app 直接打包为 IPA
          mkdir -p build/AltStore/Payload
          cp -R build/AltStore.xcarchive/Products/Applications/AltStore.app build/AltStore/Payload/
          (cd build/AltStore && zip -r ../AltStore.ipa Payload)
          ls -la build/AltStore.ipa
          
      - name: Upload AltStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-iOS
          path: build/AltStore.ipa

  # ========================================
  # AltStore PAL (EU Alternative Marketplace)
  # ========================================
  build-altstore-pal:
    name: Build AltStore PAL (EU)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AltStore PAL
        run: |
          mkdir -p build

          # PAL 与标准版共用同一 target,禁用签名后打包为独立 IPA
          xcodebuild -project AltStore/AltStore.xcodeproj \
            -scheme AltStore \
            -configuration Release \
            -archivePath build/AltStore-PAL.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_PRODUCT=NO

          mkdir -p build/AltStore-PAL/Payload
          cp -R build/AltStore-PAL.xcarchive/Products/Applications/AltStore.app build/AltStore-PAL/Payload/
          (cd build/AltStore-PAL && zip -r ../AltStore-PAL.ipa Payload)
          ls -la build/AltStore-PAL.ipa
          
      - name: Upload AltStore PAL IPA
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-PAL-iOS
          path: build/AltStore-PAL.ipa

  # ========================================
  # 创建 GitHub Release
  # ========================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-altserver-macos, build-altserver-windows, build-altstore-ios, build-altstore-pal]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Artifacts
        run: |
          echo "=== 下载的产物 ==="
          find artifacts -type f | head -20
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: AltStore ${{ github.ref_name }}
          body: |
            ## What's New
            
            See the [CHANGELOG](CHANGELOG.md) for details.
            
            ## Downloads
            
            ### AltServer (macOS)
            - `AltServer.dmg` - macOS server application (Apple Silicon)
            
            ### AltServer (Windows)
            - `AltServer-Windows.zip` - Windows 10/11 server application
            
            ### AltStore (iOS)
            - `AltStore.ipa` - iOS client app
            
            ### AltStore PAL (EU)
            - `AltStore-PAL.ipa` - EU Alternative Marketplace version
            
            ## Installation
            
            ### macOS
            1. Mount the DMG
            2. Drag AltServer to Applications
            3. Run AltServer
            
            ### Windows
            1. Download `AltServer-Windows.zip`
            2. Extract to a folder (e.g., `C:\AltServer`)
            3. Run `AltServer.exe`
            4. Place libimobiledevice tools in `tools` folder
            
            ### AltStore (iOS)
            1. Open AltServer on your computer
            2. Connect your iOS device via USB
            3. Install AltStore using AltServer
            
            ## Requirements
            - macOS 13.0+ or Windows 10+ for AltServer
            - iOS 16.0+ for AltStore
            - Xcode 15.0+ for building from source (macOS)
            - .NET 8.0+ SDK for building from source (Windows)
            
            ## Windows Tools
            
            For the Windows version, download the required tools:
            - [libimobiledevice-win32](https://github.com/libimobiledevice-win32/imobiledevice-net/releases) - Device communication
            - [zsign](https://github.com/zhlynn/zsign/releases) - IPA code signing
            
            Or run `.\scripts\download-windows-tools.ps1` to auto-download.
          files: |
            artifacts/AltServer-macOS/AltServer.dmg
            artifacts/AltServer-Windows/AltServer-Windows.zip
            artifacts/AltStore-iOS/AltStore.ipa
            artifacts/AltStore-PAL-iOS/AltStore-PAL.ipa
          draft: false
          prerelease: false
          generate_release_notes: true

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: create-release
    if: success()
    steps:
      - name: Send Notification
        run: |
          echo "Release published successfully!"
          echo "Version: ${{ github.ref_name }}"