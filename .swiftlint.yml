disabled_rules:
  - trailing_whitespace
  - line_length
  - file_length
  - type_name

opt_in_rules:
  - empty_count
  - closure_end_indentation
  - contains_over_filter_count

excluded:
  - .build
  - build
  - DerivedData

warning_threshold: 20

file_length:
  warning: 400
  error: 1000

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 300
  error: 500

nesting:
  type_level:
    warning: 3
    error: 6
  function_level:
    warning: 3
    error: 6

reporter: "xcode"